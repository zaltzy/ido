<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>מוכרים את הדירה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one narrow working column, sticky header with tabs, task-first "today" view; state shown as pills. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunken:#e9edf1; --line:#d5dce3;
  --fg:#16212b; --muted:#5b6b7a;
  --accent:#0d6e6e; --accent-fg:#ffffff; --accent-soft:#d9eeec;
  --bad:#b3261e; --bad-soft:#fbe4e1; --warn:#8a5a00; --warn-soft:#fbeccb; --ok:#1c6b3a; --ok-soft:#dcf1e3;
  --yad2:#e8590c; --fb:#1f6feb; --ig:#c2257a;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161c; --surface:#19222b; --sunken:#0c1116; --line:#2c3944;
  --fg:#e8eef3; --muted:#93a4b3;
  --accent:#4cc2bd; --accent-fg:#06211f; --accent-soft:#143635;
  --bad:#ff8a80; --bad-soft:#3d1a18; --warn:#f2c14e; --warn-soft:#3a2d0c; --ok:#7ad69a; --ok-soft:#12301e;
  --yad2:#ff8a4c; --fb:#6ea8ff; --ig:#f06bb0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#19222b; --sunken:#0c1116; --line:#2c3944;
  --fg:#e8eef3; --muted:#93a4b3;
  --accent:#4cc2bd; --accent-fg:#06211f; --accent-soft:#143635;
  --bad:#ff8a80; --bad-soft:#3d1a18; --warn:#f2c14e; --warn-soft:#3a2d0c; --ok:#7ad69a; --ok-soft:#12301e;
  --yad2:#ff8a4c; --fb:#6ea8ff; --ig:#f06bb0; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 0}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:1.4em;padding:0 5px;margin-inline-start:6px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-size:.8rem;text-align:center}

main.wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:var(--r);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{font-family:var(--display);font-weight:400;font-size:1.8rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}
.stat.hot b{color:var(--bad)}

h2{font-size:1rem;margin:0;color:var(--muted);font-weight:700}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .main{flex:1 1 220px;min-width:0}
.row .ttl{font-weight:700;overflow-wrap:anywhere}
.row .meta{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dot.yad2{background:var(--yad2)} .dot.fbgroup,.dot.fbprofile{background:var(--fb)} .dot.igstory,.dot.igpost{background:var(--ig)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.who{font-size:.82rem;font-weight:700;color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);display:inline-block;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:.88rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.phone{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;user-select:all}
.note{white-space:pre-wrap;color:var(--fg);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px}
dialog h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.88rem;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--fg);font-weight:400;font-size:1rem;width:100%}
textarea{resize:vertical;min-height:90px}
.dlgacts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dlgacts>div{display:flex;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hint{color:var(--muted);font-size:.9rem}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:fit-content;max-width:90vw;background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;z-index:20}
#gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .card{max-width:380px;text-align:center;align-items:center}
#gate h2{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--fg)}
.userbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>

<div dir="rtl" lang="he">
<div id="gate" hidden><div class="card">
  <h2>מוכרים את הדירה</h2>
  <div class="hint" id="gateMsg">הדשבורד פתוח רק לבעלי הדירה. היכנסו עם חשבון הגוגל שלכם.</div>
  <button type="button" class="btn pri" id="gateIn">כניסה עם Google</button>
  <button type="button" class="btn" id="gateOut" hidden>החלפת חשבון</button>
</div></div>
<header class="top"><div class="wrap">
  <div class="headrow">
    <div><h1 id="title">מוכרים את הדירה</h1><div class="sub" id="subtitle">טוען נתונים…</div></div>
    <div class="userbar"><div class="seg" role="group" aria-label="מי צופה" id="meSeg"></div><button type="button" class="btn sm" id="signOut" hidden>יציאה</button></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>

<main class="wrap" id="app"></main>

<dialog id="dlgLead"><form id="fLead">
  <h3 id="leadTitle">פנייה חדשה</h3>
  <div class="grid2">
    <label class="f">שם<input id="l_name" required autocomplete="off"></label>
    <label class="f">טלפון<input id="l_phone" inputmode="tel" dir="ltr" autocomplete="off"></label>
    <label class="f">הגיע דרך<select id="l_source"></select></label>
    <label class="f">סטטוס<select id="l_status"></select></label>
    <label class="f">באחריות<select id="l_owner"></select></label>
    <label class="f">לחזור אליו בתאריך<input id="l_follow" type="date"></label>
    <label class="f">ביקור בדירה<input id="l_viewing" type="datetime-local"></label>
  </div>
  <label class="f">הערות (תקציב, מה חשוב להם, מה נאמר)<textarea id="l_notes"></textarea></label>
  <div class="dlgacts"><div><button type="button" class="btn danger" id="l_del">מחק</button></div>
  <div><button type="button" class="btn" data-close>ביטול</button><button class="btn pri">שמור</button></div></div>
</form></dialog>

<dialog id="dlgTalk"><form id="fTalk">
  <h3 id="talkTitle">עדכון אחרי שיחה</h3>
  <label class="f">מה נאמר<textarea id="t_text" placeholder="למשל: מעוניינים, רוצים לבוא ביום שלישי בערב"></textarea></label>
  <div class="grid2">
    <label class="f">סטטוס<select id="t_status"></select></label>
    <label class="f">לחזור אליו בתאריך<input id="t_follow" type="date"></label>
    <label class="f">ביקור בדירה<input id="t_viewing" type="datetime-local"></label>
  </div>
  <div class="dlgacts"><div></div><div><button type="button" class="btn" data-close>ביטול</button><button class="btn pri">שמור</button></div></div>
</form></dialog>

<dialog id="dlgChan"><form id="fChan">
  <h3 id="chanTitle">פרסום חדש</h3>
  <div class="grid2">
    <label class="f">שם (למשל שם הקבוצה)<input id="c_name" required autocomplete="off"></label>
    <label class="f">סוג<select id="c_platform"></select></label>
    <label class="f">קישור<input id="c_url" type="url" dir="ltr" placeholder="https://"></label>
    <label class="f">לפרסם מחדש כל כמה ימים<input id="c_interval" type="number" min="1" max="60" required></label>
    <label class="f">באחריות<select id="c_owner"></select></label>
    <label class="f">פורסם לאחרונה<input id="c_last" type="date"></label>
  </div>
  <label class="f">טקסט ייעודי לפרסום הזה (ריק = טקסט המודעה הכללי)<textarea id="c_text"></textarea></label>
  <label class="f">הערות (כללי הקבוצה, ימים מותרים)<input id="c_notes" autocomplete="off"></label>
  <div class="dlgacts"><div><button type="button" class="btn danger" id="c_del">מחק</button></div>
  <div><button type="button" class="btn" data-close>ביטול</button><button class="btn pri">שמור</button></div></div>
</form></dialog>

<dialog id="dlgPost"><form id="fPost">
  <h3 id="postTitle">פרסום מחדש</h3>
  <div class="hint" id="postHint"></div>
  <label class="f">הטקסט לפרסום (אפשר לשנות לפני ההעתקה)<textarea id="p_text" style="min-height:180px"></textarea></label>
  <div class="chips"><button type="button" class="btn" id="p_copy">העתק טקסט</button><a class="btn" id="p_open" target="_blank" rel="noopener">פתח את המקום לפרסום</a></div>
  <div class="dlgacts"><div></div><div><button type="button" class="btn" data-close>עוד לא</button><button class="btn pri">פרסמתי, סמן כבוצע</button></div></div>
</form></dialog>

<div id="toast" hidden></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Firebase web config (not a secret; access is enforced by firestore.rules). */
const FIREBASE_CONFIG = null;
(function(){
"use strict";
document.documentElement.dir="rtl"; document.documentElement.lang="he";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const PLATFORMS={yad2:{label:"יד2",days:1,verb:"להקפיץ"},fbgroup:{label:"קבוצת פייסבוק",days:2,verb:"לפרסם"},fbprofile:{label:"פרופיל פייסבוק",days:3,verb:"לפרסם"},igstory:{label:"סטורי באינסטגרם",days:2,verb:"להעלות"},igpost:{label:"פוסט באינסטגרם",days:7,verb:"להעלות"}};
const SOURCES={phone:"טלפון",whatsapp:"וואטסאפ",yad2:"יד2",messenger:"מסנג'ר",instagram:"אינסטגרם",other:"אחר"};
const STATUSES={new:"חדשה",contacted:"בקשר",viewing:"נקבע ביקור",visited:"ביקרו בדירה",nego:"משא ומתן",closed:"לא רלוונטי"};
const STATUS_PILL={new:"bad",contacted:"",viewing:"acc",visited:"acc",nego:"ok",closed:""};

const S={ready:false,error:"",stale:false,config:{},channels:[],leads:[],tab:"today",me:"",leadFilter:"open",canWrite:true};
try{S.me=localStorage.getItem("me")||"";S.tab=localStorage.getItem("tab")||"today"}catch(e){}
let db=null;

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const fmtDate=s=>{if(!s)return"";const d=parseYmd(s.slice(0,10));return d.toLocaleDateString("he-IL",{weekday:"short",day:"numeric",month:"numeric"})};
const fmtDT=s=>{if(!s)return"";const d=new Date(s);return d.toLocaleDateString("he-IL",{weekday:"short",day:"numeric",month:"numeric"})+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
function channelDue(c){ if(!c.lastPosted) return today(); return addDays(c.lastPosted, Number(c.intervalDays)||1) }
function dueLabel(due){const n=diffDays(due,today()); if(n<0) return {t:n===-1?"באיחור של יום":"באיחור של "+(-n)+" ימים",k:"bad"}; if(n===0) return {t:"היום",k:"warn"}; if(n===1) return {t:"מחר",k:""}; return {t:"בעוד "+n+" ימים",k:""}}

/* ---------- people ---------- */
const person=k=>((S.config.people||{})[k]||{}).name||(k==="a"?"עידו":"גלית");
const whoLabel=o=>o?person(o):"שנינו";
const mine=o=>!S.me||!o||o===S.me;

/* ---------- derived ---------- */
function derive(){
  const t=today();
  const posts=S.channels.filter(c=>c.active!==false&&channelDue(c)<=t).sort((a,b)=>channelDue(a)<channelDue(b)?-1:1);
  const open=S.leads.filter(l=>l.status!=="closed");
  const fresh=open.filter(l=>l.status==="new"&&!l.lastContact);
  const follow=open.filter(l=>l.nextFollowUp&&l.nextFollowUp<=t&&!fresh.includes(l));
  const now=Date.now();
  const viewings=open.filter(l=>l.viewingAt&&new Date(l.viewingAt).getTime()>now-3*36e5&&l.viewingAt.slice(0,10)<=addDays(t,7)).sort((a,b)=>a.viewingAt<b.viewingAt?-1:1);
  return {posts,fresh,follow,viewings,open};
}

/* ---------- render ---------- */
function render(){
  const ap=S.config.apartment||{};
  $("title").textContent=ap.title||"מוכרים את הדירה";
  const bits=[ap.address,ap.rooms&&ap.rooms+" חדרים",ap.sqm&&ap.sqm+" מ\"ר",ap.price&&"₪"+Number(String(ap.price).replace(/[^\d]/g,"")).toLocaleString("he-IL")].filter(Boolean);
  $("subtitle").textContent=S.ready?(bits.join(" · ")||"מלאו את פרטי הדירה בלשונית הגדרות"):"טוען נתונים…";
  $("meSeg").innerHTML=[["","שנינו"],["a",person("a")],["b",person("b")]].map(([k,l])=>`<button type="button" data-me="${k}" aria-pressed="${S.me===k}">${esc(l)}</button>`).join("");
  const d=derive();
  const nToday=d.posts.filter(c=>mine(c.owner)).length+d.fresh.filter(l=>mine(l.owner)).length+d.follow.filter(l=>mine(l.owner)).length;
  $("tabs").innerHTML=[["today","היום",nToday],["posts","פרסומים",0],["leads","פניות",0],["settings","הגדרות",0]].map(([k,l,n])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}${n?`<span class="n">${n}</span>`:""}</button>`).join("");
  if(S.tab==="settings"&&$("app").contains(document.activeElement)&&$("fSettings")) return;
  let h="";
  if(S.error) h+=`<div class="banner">${esc(S.error)}</div>`;
  else if(S.stale) h+=`<div class="banner">הנתונים עדיין לא נטענו מהשרת. ייתכן שהמוצג לא מעודכן.</div>`;
  if(!S.canWrite) h+=`<div class="banner">אין לך הרשאת עריכה, אפשר רק לצפות. בקשו מבעל הדשבורד לשתף אתכם כעורכים.</div>`;
  h+=({today:vToday,posts:vPosts,leads:vLeads,settings:vSettings}[S.tab]||vToday)(d);
  $("app").innerHTML=h;
}

function postRow(c){
  const due=channelDue(c),dl=dueLabel(due),p=PLATFORMS[c.platform]||PLATFORMS.fbgroup;
  return `<div class="row"><span class="dot ${esc(c.platform)}"></span><div class="main"><div class="ttl">${esc(c.name)} <span class="pill ${dl.k}">${dl.t}</span></div>
  <div class="meta">${esc(p.label)} · כל ${Number(c.intervalDays)===1?"יום":esc(c.intervalDays)+" ימים"} · ${c.lastPosted?"פורסם "+fmtDate(c.lastPosted):"עוד לא פורסם"}${c.count?" · "+c.count+" פעמים":""} · <span class="who">${esc(whoLabel(c.owner))}</span>${c.notes?"<br>"+esc(c.notes):""}</div></div>
  <div class="acts"><button class="btn pri sm" data-post="${esc(c.id)}">${p.verb} עכשיו</button><button class="btn sm" data-editchan="${esc(c.id)}">ערוך</button></div></div>`;
}
function leadRow(l,compact){
  const st=l.status||"new";
  const wa=l.phone?waLink(l.phone):"";
  let extra=[];
  if(l.viewingAt) extra.push("ביקור: "+fmtDT(l.viewingAt));
  if(l.nextFollowUp&&st!=="closed"){const dl=dueLabel(l.nextFollowUp);extra.push(`לחזור: ${fmtDate(l.nextFollowUp)} <span class="pill ${dl.k}">${dl.t}</span>`)}
  if(!l.lastContact&&st==="new") extra.push(`<span class="pill bad">ממתין למענה ${waitText(l.createdAt)}</span>`);
  else if(l.lastContact) extra.push("קשר אחרון: "+fmtDate(l.lastContact.slice(0,10)));

  if(facts.length)lines.push(facts.join(" · "));

  }
  if(f.id==="fPost"&&editing){
    const c=editing;$("dlgPost").close();

  }

    const g=id=>$(id).value.trim();

let subscribed=false, seeded=false, autoMe=false, auth=null, userEmail="";
function gate(show,msg,denied){ $("gate").hidden=!show; if(msg)$("gateMsg").textContent=msg; $("gateIn").hidden=!!denied; $("gateOut").hidden=!denied }
async function seed(){
  if(seeded)return; seeded=true;
  try{
    const b=db.batch(),now=new Date().toISOString();
    b.set(db.doc("config/main"),{apartment:{},adText:"",storyText:"",replyText:"היי, תודה על הפנייה לגבי הדירה. אשמח לענות על שאלות ולתאם ביקור. מתי נוח לכם?",people:{a:{name:"עידו",email:userEmail},b:{name:"גלית",email:""}}});
    DEFAULT_CHANNELS.forEach(([id,c])=>b.set(db.doc("channels/"+id),{...c,lastPosted:"",text:"",notes:"",active:true,count:0,createdAt:now}));
    await b.commit();
  }catch(e){}
}
function subscribe(){
  if(subscribed)return; subscribed=true;
  db=firebase.firestore(); let got=0;
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  const ok=snap=>{ if(!snap.metadata.fromCache){ if(++got>=3){clearTimeout(timer);S.stale=false} } S.ready=true };
  const fail=e=>{clearTimeout(timer);S.stale=false;
    if(e&&e.code==="permission-denied"){gate(true,"הכתובת "+userEmail+" לא מורשית לדשבורד הזה. היכנסו עם החשבון שהוגדר.",true)}
    else{S.ready=true;S.error="החיבור לנתונים נותק. רעננו את העמוד.";render()}};
  db.doc("config/main").onSnapshot(s=>{
    if(!s.exists&&!s.metadata.fromCache) seed();
    S.config=s.exists?JSON.parse(JSON.stringify(s.data())):{};
    if(!autoMe&&s.exists){autoMe=true;let saved=null;try{saved=localStorage.getItem("me")}catch(e){}
      if(saved===null){const p=S.config.people||{};for(const k of ["a","b"]) if(p[k]&&p[k].email&&p[k].email.toLowerCase()===userEmail.toLowerCase()) S.me=k}}
    ok(s);render()},fail);
  db.collection("channels").onSnapshot(s=>{S.channels=s.docs.map(x=>({...x.data(),id:x.id}));ok(s);render()},fail);
  db.collection("leads").onSnapshot(s=>{S.leads=s.docs.map(x=>({...x.data(),id:x.id}));ok(s);render()},fail);
}
function start(){
  render();
  if(!FIREBASE_CONFIG||!window.firebase){S.error="הדשבורד עוד לא חובר למסד הנתונים.";render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();
  $("gateIn").addEventListener("click",async()=>{
    const p=new firebase.auth.GoogleAuthProvider();
    try{await auth.signInWithPopup(p)}
    catch(e){ if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) auth.signInWithRedirect(p); else if(e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") $("gateMsg").textContent="הכניסה נכשלה. נסו שוב." }
  });
  const out=()=>auth.signOut().then(()=>location.reload());
  $("gateOut").addEventListener("click",out); $("signOut").addEventListener("click",out);
  auth.onAuthStateChanged(u=>{
    if(!u){gate(true);return}
    userEmail=u.email||""; gate(false); $("signOut").hidden=false; $("signOut").title=userEmail; subscribe();
  });
}
start();
})();
</script>
</body>
</html>
